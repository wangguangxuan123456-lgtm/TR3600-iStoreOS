name: Build TR3600 iStoreOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl

      - name: Clone iStoreOS 25.12
        run: |
          git clone --depth 1 \
            -b istoreos-25.12 \
            https://github.com/istoreos/istoreos.git \
            istoreos

      - name: Add Cudy TR3600 support
        working-directory: istoreos
        run: |
          git remote add openwrt https://github.com/openwrt/openwrt.git
          git fetch openwrt pull/24596/head:tr3600
          git checkout tr3600 -- \
            target/linux/mediatek || true

      - name: Download TR3600 fixes
        run: |
          git clone --depth 1 \
            https://github.com/hyqhyq3/openwrt-cudy-tr3600.git \
            tr3600-support

      - name: Apply TR3600 fixes
        working-directory: istoreos
        run: |
          git apply ../tr3600-support/cudy-tr3600-v1-fixes.patch

      - name: Update feeds
        working-directory: istoreos
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure TR3600
        working-directory: istoreos
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y
          EOF

          make defconfig

      - name: Show TR3600 configuration
        working-directory: istoreos
        run: |
          grep -E 'TR3600|tr3600|TARGET_mediatek' .config || true

      - name: Download packages
        working-directory: istoreos
        run: |
          make download -j$(nproc)

      - name: Build firmware
        working-directory: istoreos
        env:
          FORCE_UNSAFE_CONFIGURE: "1"
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        run: |
          mkdir -p firmware
          find istoreos/bin/targets/mediatek/filogic \
            -type f \
            \( -name '*tr3600*.bin' -o -name '*tr3600*.manifest' -o -name 'sha256sums' \) \
            -exec cp {} firmware/ \;

          echo "Generated files:"
          ls -lah firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Cudy-TR3600-iStoreOS
          path: firmware/
